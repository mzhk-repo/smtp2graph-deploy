services:
  gateway:
    image: ${SMTP2GRAPH_IMAGE_DIGEST:?SMTP2GRAPH_IMAGE_DIGEST is required}
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /runtime:rw,nosuid,nodev,noexec,size=16m,uid=65532,gid=65532,mode=0700
      - /tmp:rw,nosuid,nodev,noexec,size=16m,uid=65532,gid=65532,mode=0700
    environment:
      GRAPH_CREDENTIAL_PATH: /run/secrets/graph-credential
    networks:
      - smtp2graph_internal
    ports:
      - target: 2525
        published: 2525
        protocol: tcp
        mode: host
    secrets:
      - source: graph_tenant_id
        target: graph-tenant-id
        uid: "65532"
        gid: "65532"
        mode: 0444
      - source: graph_client_id
        target: graph-client-id
        uid: "65532"
        gid: "65532"
        mode: 0444
      - source: graph_certificate_thumbprint
        target: graph-certificate-thumbprint
        uid: "65532"
        gid: "65532"
        mode: 0444
      - source: graph_credential
        target: graph-credential
        uid: "65532"
        gid: "65532"
        mode: 0400
      - source: smtp_credentials
        target: smtp-users
        uid: "65532"
        gid: "65532"
        mode: 0400
      - source: smtp_tls_certificate
        target: smtp-tls-cert
        uid: "65532"
        gid: "65532"
        mode: 0444
      - source: smtp_tls_private_key
        target: smtp-tls-key
        uid: "65532"
        gid: "65532"
        mode: 0400
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
          pids: 64
        reservations:
          memory: 128M
      placement:
        constraints:
          - node.labels.smtp2graph_nonproduction == true

networks:
  smtp2graph_internal:
    external: true
    name: ${SWARM_OVERLAY_NETWORK:?SWARM_OVERLAY_NETWORK is required}

secrets:
  graph_tenant_id:
    external: true
    name: ${GRAPH_TENANT_ID_SECRET_NAME:?GRAPH_TENANT_ID_SECRET_NAME is required}
  graph_client_id:
    external: true
    name: ${GRAPH_CLIENT_ID_SECRET_NAME:?GRAPH_CLIENT_ID_SECRET_NAME is required}
  graph_certificate_thumbprint:
    external: true
    name: ${GRAPH_CERTIFICATE_THUMBPRINT_SECRET_NAME:?GRAPH_CERTIFICATE_THUMBPRINT_SECRET_NAME is required}
  graph_credential:
    external: true
    name: ${GRAPH_CREDENTIAL_SECRET_NAME:?GRAPH_CREDENTIAL_SECRET_NAME is required}
  smtp_credentials:
    external: true
    name: ${SMTP_CREDENTIALS_SECRET_NAME:?SMTP_CREDENTIALS_SECRET_NAME is required}
  smtp_tls_certificate:
    external: true
    name: ${TLS_CERTIFICATE_SECRET_NAME:?TLS_CERTIFICATE_SECRET_NAME is required}
  smtp_tls_private_key:
    external: true
    name: ${TLS_PRIVATE_KEY_SECRET_NAME:?TLS_PRIVATE_KEY_SECRET_NAME is required}
